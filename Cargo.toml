[package]
name = "fxlauncher"
version = "0.1.0"
edition = "2024"
description = "A lightweight cross-platform Minecraft launcher written in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
aegle = { git = "https://github.com/antinomie1/aegle" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v3", "v4"] }
md-5 = "0.10"

[dev-dependencies]
tempfile = "3.17"
